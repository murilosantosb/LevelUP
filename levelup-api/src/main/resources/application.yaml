spring:
  application:
    name: levelup-api
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    url: ${DB_URL:jdbc:mysql://localhost:3306/leveup_api?createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

server:
  address: 0.0.0.0
  port: ${PORT:8080}

app:
  auth:
    token-duration: ${AUTH_TOKEN_DURATION:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
